<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#140b18"/>
    </linearGradient>
    <linearGradient id="glowM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orbCoreM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="80%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <filter id="softGlowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>
  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bgM)"/>
  <!-- Content scaled inside 80% safe zone (center 256, 256) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <circle cx="256" cy="256" r="160" fill="url(#glowM)" opacity="0.3"/>
    <circle cx="256" cy="256" r="145" fill="none" stroke="url(#glowM)" stroke-width="4" opacity="0.5" stroke-dasharray="10 14"/>
    <circle cx="256" cy="256" r="85" fill="url(#orbCoreM)" filter="url(#softGlowM)"/>
    <circle cx="256" cy="256" r="80" fill="url(#orbCoreM)"/>
    <path d="M 210 256 C 210 232, 235 205, 256 185 C 277 205, 302 232, 302 256 C 302 280, 277 307, 256 327 C 235 307, 210 280, 210 256 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="256" r="24" fill="#ffe4e6"/>
  </g>
</svg>
