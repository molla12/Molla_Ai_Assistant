<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Molla AI Assistant</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      var target = '/' + repo + '/';
      window.location.replace(window.location.origin + target);
    </script>
  </head>
  <body style="background:#07090e;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Loading Molla AI Assistant...</p>
  </body>
</html>
