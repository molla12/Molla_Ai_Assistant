    <script>
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('failed to connect to websocket') !== -1)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        // Fix GitHub Pages subpath: ensure trailing slash so relative assets resolve within repository path
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <script>
      window.addEventListener('error', function(e) {
        var banner = document.getElementById('molla-error-banner');
        var btn = document.getElementById('molla-reload-btn');
        if (banner) {
          banner.style.display = 'block';
          banner.textContent = 'Startup error: ' + (e.message || 'Script failed to run');
        }
        if (btn) btn.style.display = 'inline-block';
      });
      // Safety timer: if root still has the preloader after 4 seconds, show reload option
      setTimeout(function() {
        var sub = document.getElementById('molla-preloader-sub');
        var btn = document.getElementById('molla-reload-btn');
        if (sub && btn) {
          sub.textContent = 'Starting Molla AI Assistant... If it takes long, tap below:';
          btn.style.display = 'inline-block';
        }
      }, 4000);
    </script>
